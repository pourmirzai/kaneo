name: Build test image (fork)

# Temporary workflow to build a test image from the fork and publish it to GHCR.
# The build runs on GitHub's runners, so the Coolify server only pulls the image.
# NOT intended for upstream PRs — revert before opening a PR.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag for the test image (e.g., persian-test)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build-kaneo-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.kaneo
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/kaneo:${{ inputs.version }}
